apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: django-backend-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
    
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: django-backend-binding
subjects:
  - kind: ServiceAccount
    name: django-backend
    namespace: default
roleRef:
  kind: ClusterRole
  name: django-backend-role
  apiGroup: rbac.authorization.k8s.io
