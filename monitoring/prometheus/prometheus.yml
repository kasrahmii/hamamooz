global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hamamooz-backend"
    # django-prometheus-style metrics exposed by the Django REST backend.
    # On macOS the backend runs on the host (127.0.0.1:8000), reachable from
    # containers via host.docker.internal.
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
